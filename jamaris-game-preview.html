<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#FFD93D" />
<title>Jamaris Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bowlby+One&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    font-family: 'Fredoka', sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    background: linear-gradient(135deg, #FFE5F1 0%, #E5F1FF 25%, #FFF5D6 50%, #E5FFE9 75%, #FFE5F1 100%);
    background-size: 400% 400%;
    animation: rainbowShift 20s ease infinite;
    color: #2a2a3e;
    height: 100dvh;
  }
  @keyframes rainbowShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- HOME SCREEN ---------- */
  #home {
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    align-items: center;
    justify-content: space-between;
  }
  .title-wrap { text-align: center; padding-top: 10px; }
  .title {
    font-family: 'Bowlby One', sans-serif;
    font-size: clamp(2.8rem, 12vw, 4.5rem);
    line-height: 1;
    letter-spacing: -2px;
    display: inline-block;
  }
  .title span {
    display: inline-block;
    animation: bounce 2s ease-in-out infinite;
  }
  .title span:nth-child(1) { color: #FF4F8B; animation-delay: 0s; }
  .title span:nth-child(2) { color: #FFA62B; animation-delay: 0.1s; }
  .title span:nth-child(3) { color: #FFD93D; animation-delay: 0.2s; }
  .title span:nth-child(4) { color: #6BCB77; animation-delay: 0.3s; }
  .title span:nth-child(5) { color: #4D96FF; animation-delay: 0.4s; }
  .title span:nth-child(6) { color: #9B5DE5; animation-delay: 0.5s; }
  .title span:nth-child(7) { color: #FF4F8B; animation-delay: 0.6s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-12px) rotate(2deg); }
  }
  .subtitle {
    font-size: 1.1rem;
    font-weight: 600;
    color: #6b6b8a;
    margin-top: 8px;
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    width: 100%;
    max-width: 480px;
    padding: 10px 4px;
  }
  .game-card {
    aspect-ratio: 1;
    border-radius: 28px;
    border: 5px solid #2a2a3e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    box-shadow: 0 8px 0 #2a2a3e, 0 12px 24px rgba(0,0,0,0.15);
    transition: transform 0.15s, box-shadow 0.15s;
    overflow: hidden;
  }
  .game-card:active {
    transform: translateY(4px);
    box-shadow: 0 4px 0 #2a2a3e, 0 6px 12px rgba(0,0,0,0.15);
  }
  .game-card.coloring { background: #FFB5D8; }
  .game-card.locked   { background: #E8E8F0; cursor: not-allowed; }
  .game-card .emoji {
    font-size: clamp(3rem, 14vw, 5rem);
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.1));
  }
  .game-card .label {
    font-weight: 700;
    font-size: 1.1rem;
    margin-top: 6px;
    color: #2a2a3e;
  }
  .game-card.locked .label { color: #9999b0; }
  .game-card.locked .emoji { opacity: 0.4; filter: grayscale(0.7); }
  .lock-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: #2a2a3e;
    color: white;
    font-size: 0.7rem;
    padding: 4px 8px;
    border-radius: 20px;
    font-weight: 700;
  }

  .star-display {
    display: flex;
    align-items: center;
    gap: 8px;
    background: white;
    padding: 12px 22px;
    border-radius: 999px;
    border: 4px solid #2a2a3e;
    box-shadow: 0 5px 0 #2a2a3e;
    font-weight: 700;
    font-size: 1.3rem;
  }
  .star-display .star { font-size: 1.6rem; animation: spin 4s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* ---------- COLORING SCREEN ---------- */
  #coloring {
    padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 4px;
    gap: 8px;
  }
  .icon-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 4px solid #2a2a3e;
    background: white;
    font-size: 1.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 0 #2a2a3e;
    transition: transform 0.1s, box-shadow 0.1s;
    flex-shrink: 0;
  }
  .icon-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #2a2a3e;
  }
  .mini-stars {
    background: white;
    border: 4px solid #2a2a3e;
    border-radius: 999px;
    padding: 6px 16px;
    font-weight: 700;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 0 #2a2a3e;
  }

  .canvas-wrap {
    flex: 1;
    margin: 8px 0;
    background: white;
    border-radius: 28px;
    border: 5px solid #2a2a3e;
    box-shadow: 0 6px 0 #2a2a3e;
    position: relative;
    overflow: hidden;
    touch-action: none;
  }
  #drawCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #outlineSvg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #outlineSvg path, #outlineSvg circle, #outlineSvg ellipse {
    fill: none;
    stroke: #2a2a3e;
    stroke-width: 6;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  /* Color palette */
  .palette {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 10px 6px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .palette::-webkit-scrollbar { display: none; }
  .crayon {
    flex-shrink: 0;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 4px solid #2a2a3e;
    cursor: pointer;
    box-shadow: 0 4px 0 #2a2a3e;
    transition: transform 0.15s;
    scroll-snap-align: center;
    position: relative;
  }
  .crayon:active { transform: scale(0.9); }
  .crayon.active {
    transform: scale(1.15) translateY(-4px);
    box-shadow: 0 8px 0 #2a2a3e, 0 0 0 4px white, 0 0 0 8px #FFD93D;
  }

  .brush-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 4px 6px 8px;
  }
  .brush-btn {
    border: 4px solid #2a2a3e;
    background: white;
    border-radius: 999px;
    padding: 6px 14px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    box-shadow: 0 3px 0 #2a2a3e;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brush-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #2a2a3e; }
  .brush-btn.active { background: #FFD93D; }
  .brush-dot { background: currentColor; border-radius: 50%; display: inline-block; }

  /* Celebration overlay */
  .celebrate {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .celebrate.active { display: flex; }
  .celebrate .msg {
    font-family: 'Bowlby One', sans-serif;
    font-size: clamp(3rem, 15vw, 6rem);
    color: white;
    -webkit-text-stroke: 4px #2a2a3e;
    paint-order: stroke fill;
    animation: pop 1s ease-out;
    text-align: center;
  }
  @keyframes pop {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    50% { transform: scale(1.2) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .confetti {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    animation: fall 2s ease-in forwards;
  }
  @keyframes fall {
    0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* Modal */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-bg.active { display: flex; }
  .modal {
    background: white;
    border: 5px solid #2a2a3e;
    border-radius: 28px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 8px 0 #2a2a3e;
    max-width: 320px;
    width: 100%;
  }
  .modal h2 { font-family: 'Bowlby One', sans-serif; font-size: 1.6rem; margin-bottom: 16px; color: #2a2a3e; }
  .modal-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
  .modal-btn {
    border: 4px solid #2a2a3e;
    border-radius: 18px;
    padding: 12px 20px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    box-shadow: 0 4px 0 #2a2a3e;
    cursor: pointer;
    min-width: 100px;
  }
  .modal-btn.yes { background: #FF4F8B; color: white; }
  .modal-btn.no { background: white; }
  .modal-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2a2a3e; }

  /* Decorative floating shapes on home */
  .floater {
    position: absolute;
    font-size: 2.5rem;
    opacity: 0.6;
    animation: float 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(15deg); }
  }
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div class="screen active" id="home">
  <div class="floater" style="top: 18%; left: 8%; animation-delay: 0s;">⭐</div>
  <div class="floater" style="top: 22%; right: 10%; animation-delay: 1.5s;">🌈</div>
  <div class="floater" style="bottom: 30%; left: 5%; animation-delay: 3s;">🎈</div>
  <div class="floater" style="bottom: 35%; right: 6%; animation-delay: 2s;">✨</div>

  <div class="title-wrap">
    <div class="title">
      <span>J</span><span>A</span><span>M</span><span>A</span><span>R</span><span>I</span><span>S</span>
    </div>
    <div class="subtitle">~ let's play! ~</div>
  </div>

  <div class="games-grid">
    <div class="game-card coloring" onclick="openColoring()">
      <div class="emoji">🎨</div>
      <div class="label">Coloring</div>
    </div>
    <div class="game-card locked">
      <div class="lock-badge">SOON</div>
      <div class="emoji">🐾</div>
      <div class="label">Animal Sounds</div>
    </div>
    <div class="game-card locked">
      <div class="lock-badge">SOON</div>
      <div class="emoji">🔢</div>
      <div class="label">Counting</div>
    </div>
    <div class="game-card locked">
      <div class="lock-badge">SOON</div>
      <div class="emoji">🧩</div>
      <div class="label">Shapes</div>
    </div>
  </div>

  <div class="star-display">
    <span class="star">⭐</span>
    <span>Stars: <span id="homeStars">0</span></span>
  </div>
</div>

<!-- COLORING SCREEN -->
<div class="screen" id="coloring">
  <div class="top-bar">
    <button class="icon-btn" onclick="askGoHome()" aria-label="Home">🏠</button>
    <div class="mini-stars">⭐ <span id="gameStars">0</span></div>
    <button class="icon-btn" onclick="nextAnimal()" aria-label="New animal">🔄</button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="drawCanvas"></canvas>
    <svg id="outlineSvg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="brush-row">
    <button class="brush-btn" id="brushSmall" onclick="setBrush(12)">
      <span class="brush-dot" style="width:8px;height:8px;"></span> Small
    </button>
    <button class="brush-btn active" id="brushMed" onclick="setBrush(24)">
      <span class="brush-dot" style="width:14px;height:14px;"></span> Medium
    </button>
    <button class="brush-btn" id="brushBig" onclick="setBrush(40)">
      <span class="brush-dot" style="width:22px;height:22px;"></span> Big
    </button>
    <button class="icon-btn" onclick="clearCanvas()" aria-label="Erase">🧽</button>
  </div>

  <div class="palette" id="palette"></div>
</div>

<!-- Celebration -->
<div class="celebrate" id="celebrate">
  <div class="msg" id="celebrateMsg">YAY!</div>
</div>

<!-- Go-home confirmation -->
<div class="modal-bg" id="homeModal">
  <div class="modal">
    <h2>Go home? 🏠</h2>
    <p style="font-size:1rem; color:#6b6b8a;">Your drawing will be erased.</p>
    <div class="modal-buttons">
      <button class="modal-btn no" onclick="closeModal()">Stay</button>
      <button class="modal-btn yes" onclick="goHome()">Yes</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   JAMARIS GAME — Free-draw coloring with sounds + stars
   ============================================================ */

// --- COLORS ---
const COLORS = [
  '#FF3B6C', '#FF6B35', '#FFA62B', '#FFD93D',
  '#A8E063', '#56CCF2', '#4D96FF', '#9B5DE5',
  '#FF7AD9', '#8B4513', '#2a2a3e', '#F5F5F5'
];
let currentColor = COLORS[0];
let brushSize = 24;

// --- STARS (saved in memory; localStorage would be added in the GitHub version) ---
let stars = 0;
function updateStars() {
  document.getElementById('homeStars').textContent = stars;
  document.getElementById('gameStars').textContent = stars;
}

// --- AUDIO via Web Audio API (no external files needed for prototype) ---
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, duration = 0.12, type = 'sine', vol = 0.15) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}
function playClick() { playTone(800, 0.08, 'triangle'); }
function playPop(hue=0) { playTone(300 + hue*30, 0.1, 'sine', 0.1); }
function playYay() {
  [523, 659, 784, 1047].forEach((f,i) => setTimeout(()=>playTone(f, 0.2, 'triangle', 0.18), i*100));
}

// --- BUILD PALETTE ---
const paletteEl = document.getElementById('palette');
COLORS.forEach((color, i) => {
  const c = document.createElement('div');
  c.className = 'crayon' + (i === 0 ? ' active' : '');
  c.style.background = color;
  c.dataset.color = color;
  c.dataset.index = i;
  c.addEventListener('click', () => {
    document.querySelectorAll('.crayon').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    currentColor = color;
    playPop(i);
  });
  paletteEl.appendChild(c);
});

// --- BRUSH SIZES ---
function setBrush(size) {
  brushSize = size;
  document.querySelectorAll('.brush-btn').forEach(b => b.classList.remove('active'));
  if (size === 12) document.getElementById('brushSmall').classList.add('active');
  if (size === 24) document.getElementById('brushMed').classList.add('active');
  if (size === 40) document.getElementById('brushBig').classList.add('active');
  playClick();
}

// --- ANIMALS (simple SVG outlines) ---
const ANIMALS = [
  { // CAT
    name: 'cat',
    paths: `
      <path d="M120 180 L110 90 L170 140 L230 140 L290 90 L280 180" />
      <path d="M120 180 Q90 240 120 300 Q140 340 200 340 Q260 340 280 300 Q310 240 280 180" />
      <circle cx="160" cy="220" r="8"/>
      <circle cx="240" cy="220" r="8"/>
      <path d="M195 250 Q200 260 205 250" />
      <path d="M200 260 L200 280" />
      <path d="M170 275 Q200 295 230 275" />
      <path d="M140 230 L100 220 M140 240 L100 245 M260 230 L300 220 M260 240 L300 245" />
    `
  },
  { // FISH
    name: 'fish',
    paths: `
      <path d="M80 200 Q120 130 220 130 Q300 130 320 200 Q300 270 220 270 Q120 270 80 200 Z" />
      <path d="M80 200 L30 150 L40 200 L30 250 Z" />
      <circle cx="260" cy="185" r="10"/>
      <path d="M200 170 Q210 180 220 170 M200 220 Q210 230 220 220" />
      <path d="M150 200 Q170 195 190 200 Q170 205 150 200" />
    `
  },
  { // BUTTERFLY
    name: 'butterfly',
    paths: `
      <ellipse cx="200" cy="200" rx="12" ry="60"/>
      <circle cx="200" cy="145" r="14"/>
      <path d="M195 135 Q185 115 195 105 M205 135 Q215 115 205 105" />
      <path d="M188 170 Q100 120 80 200 Q90 240 188 220 Z" />
      <path d="M212 170 Q300 120 320 200 Q310 240 212 220 Z" />
      <path d="M188 220 Q120 240 110 290 Q160 300 188 260 Z" />
      <path d="M212 220 Q280 240 290 290 Q240 300 212 260 Z" />
      <circle cx="140" cy="190" r="6"/>
      <circle cx="260" cy="190" r="6"/>
    `
  },
  { // ELEPHANT
    name: 'elephant',
    paths: `
      <path d="M100 200 Q100 130 180 120 Q260 120 280 170 L300 170 Q330 170 330 210 Q330 250 300 250 L290 280 Q290 320 250 320 L240 320 L240 290 L200 290 L200 320 L160 320 Q120 320 120 280 L120 250 Q100 240 100 200 Z" />
      <circle cx="180" cy="170" r="6"/>
      <path d="M170 240 Q170 280 150 310 Q140 330 160 340 Q180 335 180 310 Q185 280 195 260" />
      <path d="M80 200 Q60 220 80 250" />
    `
  },
  { // BIRD
    name: 'bird',
    paths: `
      <path d="M120 230 Q120 150 200 140 Q280 150 280 230 Q280 290 200 300 Q120 290 120 230 Z" />
      <circle cx="240" cy="200" r="6"/>
      <path d="M280 215 L320 210 L320 230 L280 235 Z" />
      <path d="M120 240 Q100 280 130 290 Q150 280 140 260" />
      <path d="M180 300 L175 330 L190 320 M210 300 L215 330 L200 320" />
      <path d="M150 200 Q170 190 200 195 Q180 210 150 200" />
    `
  },
  { // TURTLE
    name: 'turtle',
    paths: `
      <ellipse cx="200" cy="220" rx="110" ry="80"/>
      <path d="M200 160 L170 200 L185 250 L215 250 L230 200 Z" />
      <path d="M170 200 L130 215 M230 200 L270 215 M185 250 L175 290 M215 250 L225 290" />
      <circle cx="305" cy="200" r="25"/>
      <circle cx="312" cy="195" r="4"/>
      <path d="M295 215 Q305 220 315 215" />
      <path d="M110 200 Q90 200 95 215 L120 215 M290 290 L300 305 M120 290 L110 305 M280 290 L290 305" />
    `
  }
];
let currentAnimalIndex = 0;

// --- CANVAS SETUP ---
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
const svg = document.getElementById('outlineSvg');

function resizeCanvas() {
  const wrap = document.getElementById('canvasWrap');
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  // Save the existing drawing
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = canvas.width;
  tempCanvas.height = canvas.height;
  if (canvas.width > 0) tempCanvas.getContext('2d').drawImage(canvas, 0, 0);

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Restore (scaled)
  if (tempCanvas.width > 0) {
    ctx.drawImage(tempCanvas, 0, 0, rect.width, rect.height);
  }
}
window.addEventListener('resize', resizeCanvas);

function loadAnimal(idx) {
  const animal = ANIMALS[idx];
  svg.innerHTML = animal.paths;
  clearCanvas(true);
}

function nextAnimal() {
  currentAnimalIndex = (currentAnimalIndex + 1) % ANIMALS.length;
  loadAnimal(currentAnimalIndex);
  playClick();
}

function clearCanvas(silent=false) {
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);
  if (!silent) playClick();
  drawingPixels = 0;
  hasCelebrated = false;
}

// --- DRAWING ---
let isDrawing = false;
let lastX = 0, lastY = 0;
let drawingPixels = 0;
let hasCelebrated = false;
const COMPLETION_THRESHOLD = 8000; // approximate pixel-strokes to celebrate

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  return {
    x: touch.clientX - rect.left,
    y: touch.clientY - rect.top
  };
}

function startDraw(e) {
  e.preventDefault();
  isDrawing = true;
  const pos = getPos(e);
  lastX = pos.x;
  lastY = pos.y;
  // Dot for a single tap
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, brushSize/2, 0, Math.PI*2);
  ctx.fillStyle = currentColor;
  ctx.fill();
  // Soft sound on first touch
  playTone(400 + Math.random()*200, 0.05, 'sine', 0.08);
}

function draw(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const pos = getPos(e);
  ctx.strokeStyle = currentColor;
  ctx.lineWidth = brushSize;
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
  const dx = pos.x - lastX, dy = pos.y - lastY;
  drawingPixels += Math.sqrt(dx*dx + dy*dy) * brushSize / 10;
  lastX = pos.x;
  lastY = pos.y;
  if (!hasCelebrated && drawingPixels > COMPLETION_THRESHOLD) {
    hasCelebrated = true;
    celebrate();
  }
}

function stopDraw() { isDrawing = false; }

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDraw);
canvas.addEventListener('mouseleave', stopDraw);
canvas.addEventListener('touchstart', startDraw, { passive: false });
canvas.addEventListener('touchmove', draw, { passive: false });
canvas.addEventListener('touchend', stopDraw);

// --- CELEBRATION ---
function celebrate() {
  stars++;
  updateStars();
  playYay();
  const c = document.getElementById('celebrate');
  const msgs = ['YAY!', 'WOW!', 'NICE!', 'SUPER!', 'AMAZING!'];
  document.getElementById('celebrateMsg').textContent = msgs[Math.floor(Math.random()*msgs.length)];
  c.classList.add('active');
  spawnConfetti();
  setTimeout(() => c.classList.remove('active'), 2200);
}

function spawnConfetti() {
  const colors = ['#FF3B6C', '#FFD93D', '#56CCF2', '#A8E063', '#9B5DE5', '#FF7AD9'];
  for (let i = 0; i < 40; i++) {
    const conf = document.createElement('div');
    conf.className = 'confetti';
    conf.style.background = colors[Math.floor(Math.random()*colors.length)];
    conf.style.left = Math.random()*100 + 'vw';
    conf.style.top = '-20px';
    conf.style.animationDelay = (Math.random()*0.5) + 's';
    document.getElementById('celebrate').appendChild(conf);
    setTimeout(() => conf.remove(), 2500);
  }
}

// --- NAVIGATION ---
function openColoring() {
  playClick();
  document.getElementById('home').classList.remove('active');
  document.getElementById('coloring').classList.add('active');
  setTimeout(() => {
    resizeCanvas();
    loadAnimal(currentAnimalIndex);
  }, 50);
}
function askGoHome() {
  playClick();
  document.getElementById('homeModal').classList.add('active');
}
function closeModal() {
  document.getElementById('homeModal').classList.remove('active');
  playClick();
}
function goHome() {
  document.getElementById('homeModal').classList.remove('active');
  document.getElementById('coloring').classList.remove('active');
  document.getElementById('home').classList.add('active');
  playClick();
}

// init
updateStars();
</script>
