<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#FFD93D" />
<title>Jamaris Game — Coloring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bowlby+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- PICKER SCREEN -->
<div class="screen active" id="picker">
  <div class="top-bar">
    <a href="../index.html" class="icon-btn" aria-label="Home">🏠</a>
    <div class="mini-stars">⭐ <span id="pickerStars">0</span></div>
    <div style="width:52px;"></div>
  </div>

  <div class="picker-title">
    <h1>Pick an animal!</h1>
    <p>← swipe →</p>
  </div>

  <div class="animal-carousel" id="animalCarousel">
    <!-- Cards inserted by JS -->
  </div>
</div>

<!-- COLORING SCREEN -->
<div class="screen" id="coloring">
  <div class="top-bar">
    <button class="icon-btn" id="backBtn" aria-label="Back">⬅️</button>
    <div class="mini-stars">⭐ <span id="gameStars">0</span></div>
    <button class="icon-btn" id="nextBtn" aria-label="New animal">🔄</button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="ghostCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
  </div>

  <div class="brush-row">
    <button class="brush-btn" data-brush="12">
      <span class="brush-dot" style="width:8px;height:8px;"></span> Small
    </button>
    <button class="brush-btn active" data-brush="24">
      <span class="brush-dot" style="width:14px;height:14px;"></span> Medium
    </button>
    <button class="brush-btn" data-brush="40">
      <span class="brush-dot" style="width:22px;height:22px;"></span> Big
    </button>
    <button class="icon-btn" id="eraseBtn" aria-label="Erase">🧽</button>
  </div>

  <div class="palette" id="palette"></div>
</div>

<!-- Celebration -->
<div class="celebrate" id="celebrate">
  <div class="msg" id="celebrateMsg">YAY!</div>
</div>

<script src="../js/coloring.js"></script>
</body>
</html>
