<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#FFD93D" />
<title>Jamaris Game — Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bowlby+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- PICKER SCREEN -->
<div class="screen active" id="picker">
  <div class="top-bar">
    <a href="../index.html" class="icon-btn" aria-label="Home">🏠</a>
    <div class="mode-toggle" id="picker-mode-toggle">
      <button class="mode-btn active" data-set="letters">ABC</button>
      <button class="mode-btn" data-set="numbers">123</button>
    </div>
    <div class="mini-stars">⭐ <span id="pickerStars">0</span></div>
  </div>

  <div class="picker-title">
    <h1>Pick a letter!</h1>
    <p>← swipe →</p>
  </div>

  <div class="letter-grid" id="letterGrid">
    <!-- Letter cards inserted by JS -->
  </div>
</div>

<!-- TRACING SCREEN -->
<div class="screen" id="game">
  <div class="top-bar">
    <button class="icon-btn" id="backBtn" aria-label="Back">⬅️</button>
    <div class="letter-progress" id="letterProgress">Stroke 1 of 3</div>
    <button class="icon-btn" id="resetBtn" aria-label="Restart">🔄</button>
  </div>

  <div class="tracing-stage" id="tracingStage">
    <svg id="letterSvg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid meet">
      <!-- Background letter, guide path, drawn line, and dots all inside this SVG -->
    </svg>
  </div>

  <div class="letter-controls">
    <button class="big-letter-btn" id="prevLetterBtn">⬅️</button>
    <div class="current-letter-display" id="currentLetterDisplay">A</div>
    <button class="big-letter-btn" id="nextLetterBtn">➡️</button>
  </div>
</div>

<!-- Celebration -->
<div class="celebrate" id="celebrate">
  <div class="msg" id="celebrateMsg">A!</div>
</div>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#FFD93D" />
<title>Jamaris Game — Coloring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bowlby+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- PICKER SCREEN -->
<div class="screen active" id="picker">
  <div class="top-bar">
    <a href="../index.html" class="icon-btn" aria-label="Home">🏠</a>
    <div class="mini-stars">⭐ <span id="pickerStars">0</span></div>
    <div style="width:52px;"></div>
  </div>

  <div class="picker-title">
    <h1>Pick an animal!</h1>
    <p>← swipe →</p>
  </div>

  <div class="animal-carousel" id="animalCarousel">
    <!-- Cards inserted by JS -->
  </div>
</div>

<!-- COLORING SCREEN -->
<div class="screen" id="coloring">
  <div class="top-bar">
    <button class="icon-btn" id="backBtn" aria-label="Back">⬅️</button>
    <div class="mode-toggle" id="modeToggle">
      <button class="mode-btn active" data-mode="tap">👆 Tap</button>
      <button class="mode-btn" data-mode="brush">✏️ Brush</button>
    </div>
    <button class="icon-btn" id="nextBtn" aria-label="New animal">🔄</button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <!-- Tap-to-fill mode: an interactive SVG with separate parts -->
    <svg id="animalSvg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet"></svg>
    <!-- Brush mode: a canvas overlay for free-draw -->
    <canvas id="drawCanvas"></canvas>
  </div>

  <div class="brush-row" id="brushRow">
    <button class="brush-btn" data-brush="12">
      <span class="brush-dot" style="width:8px;height:8px;"></span> Small
    </button>
    <button class="brush-btn active" data-brush="24">
      <span class="brush-dot" style="width:14px;height:14px;"></span> Medium
    </button>
    <button class="brush-btn" data-brush="40">
      <span class="brush-dot" style="width:22px;height:22px;"></span> Big
    </button>
    <button class="icon-btn" id="eraseBtn" aria-label="Erase">🧽</button>
  </div>

  <div class="palette" id="palette"></div>
</div>

<!-- Celebration -->
<div class="celebrate" id="celebrate">
  <div class="msg" id="celebrateMsg">YAY!</div>
</div>
<script src="../js/kiosk.js"></script>
<script src="../js/coloring.js"></script>
</body>
</html>
